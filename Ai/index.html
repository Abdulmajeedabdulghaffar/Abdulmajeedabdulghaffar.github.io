<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IMPERROR AI</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div>
        <div class="brand">IMPERROR <span>AI</span></div>
        <div class="sub">Web Security Analysis Agent</div>
      </div>
      <div class="status"><i></i><span id="statusText">Ready</span></div>
    </header>

    <main class="grid">
      <section class="card controls">
        <h2>Target</h2>
        <label>URL</label>
        <input id="target" type="url" placeholder="https://example.com" autocomplete="off">

        <label>Authorization</label>
        <select id="authMode">
          <option value="none">None</option>
          <option value="cookie">Cookie header</option>
        </select>
        <input id="cookie" class="hidden" type="password" placeholder="session=...">

        <label>Analysis modules</label>
        <div class="checks">
          <label><input type="checkbox" value="recon" checked> Recon & site mapping</label>
          <label><input type="checkbox" value="api" checked> API / endpoint discovery</label>
          <label><input type="checkbox" value="auth" checked> Authentication review</label>
          <label><input type="checkbox" value="access-control" checked> Authorization review</label>
          <label><input type="checkbox" value="xss"> XSS indicators</label>
          <label><input type="checkbox" value="business-logic" checked> Business-logic hypotheses</label>
          <label><input type="checkbox" value="headers" checked> Security headers</label>
        </div>

        <div class="scope-note">Only scan systems you own or are explicitly authorized to test.</div>
        <button id="startBtn">START ANALYSIS</button>
      </section>

      <section class="card activity">
        <div class="card-head"><h2>Agent activity</h2><span id="elapsed">00:00</span></div>
        <div id="logs" class="logs">
          <div class="log muted">Waiting for a target…</div>
        </div>
      </section>

      <section class="card findings">
        <div class="card-head"><h2>AI assessment</h2><span id="findingCount">0 findings</span></div>
        <div id="findings" class="findings-list">
          <div class="empty">Your findings will appear here after analysis.</div>
        </div>
      </section>
    </main>
  </div>
  <script src="./app.js"></script>
</body>
</html>
