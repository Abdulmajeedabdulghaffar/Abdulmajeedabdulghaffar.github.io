<!doctype html>
<html>
<body>
<script>
fetch("https://www.oyorooms.com/?modal=onboarding", {
    method: "GET",
    credentials: "include"
})
.then(async r => {
    console.log("STATUS:", r.status);
    console.log("URL:", r.url);
    console.log("TYPE:", r.type);

    const body = await r.text();
    console.log("BODY:", body);
})
.catch(e => {
    console.log("CORS BLOCKED:", e);
});
</script>
</body>
</html>
