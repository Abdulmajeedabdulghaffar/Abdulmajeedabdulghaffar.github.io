<!DOCTYPE html>
<html>
<body>
<button onclick="test()">Test Deere CORS</button>

<pre id="out"></pre>

<script>
async function test() {
    try {
        const res = await fetch("https://add-equipment.deere.com/toggles", {
            method: "POST",
            credentials: "include",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                orgId: "9136520"
            })
        });

        const text = await res.text();
        document.getElementById("out").textContent = text;
    } catch(e) {
        document.getElementById("out").textContent = e;
    }
}
</script>

</body>
</html>
